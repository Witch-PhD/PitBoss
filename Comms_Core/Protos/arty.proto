syntax = "proto3";

option csharp_namespace = "Comms_Core";

package arty;

service Arty
{
	rpc openStream(stream ArtyMsg) returns (stream ArtyMsg);
}

message ArtyMsg
{
	string Callsign = 1;
	string SessionId = 2;
	oneof MsgType
	{
		Coords coords = 3;
		ClientReport clientReport = 4;
		ServerReport ServerReport = 5;
		AckMsgId Ack = 6;
		ServerCommand  serverCommand = 7;
	}
}

message Coords
{
	int32 MsgId = 1;
	double Az = 2;
	double Dist = 3;
}

message AckMsgId
{
	int32 MsgId = 1;
}

message ClientReport
{
	int32 ClientType = 1; // 0 == Invalid, 1 == Spotter, Gunner == 2
	string SessionPassword = 2;
	int32 LastCoordsIdReceived = 3;
	int32 LastCoordsIdSent = 4; // For use by spotter if they are client.
}

message ServerReport
{
	int32 ActiveCallsignsCount = 1;
	repeated string ActiveCallsigns = 2;
	int32 LastCoordsIdReceived = 3;
	int32 LastCoordsIdSent = 4;
}

message ServerCommand
{
	int32 CommandType = 1; // 0 == Not used, 1 == Refused Password
	string CommandMsg = 2; // Message to send to client
}